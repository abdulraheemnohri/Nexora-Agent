[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-agent"
version = "1.0.0"
description = "Local-first self-growing AI agent with Claude and configurable LiteRT-LM CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "httpx>=0.27,<1", "anthropic>=0.40,<1", "typer>=0.12,<1", "rich>=13.8,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
nexora = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
