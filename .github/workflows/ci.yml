name: Nexora CI

on:
  push:
    branches: ["main", "nexora-v1-complete", "hermes-node-html"]
  pull_request:
    branches: ["main", "nexora-v1-complete"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: find . -path ./node_modules -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run tests
        run: npm test
